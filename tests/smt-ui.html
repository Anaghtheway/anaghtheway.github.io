<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electronic packaging guide checks</title>
  <style>
    body { background: #08131e; color: #edf3f8; font: 14px monospace; }
    iframe { display: block; border: 0; height: 2200px; margin-top: 20px; }
  </style>
</head>
<body>
  <details><summary id="summary">Running...</summary><pre id="results"></pre></details>
  <script>
    const messages = [];
    function assert(condition, message) {
      if (!condition) throw new Error(message);
      messages.push('PASS ' + message);
    }
    async function check(width) {
      const frame = document.createElement('iframe');
      frame.style.width = width + 'px';
      frame.title = width + 'px packaging guide';
      const loaded = new Promise(resolve => { frame.onload = resolve; });
      frame.src = '../smt.html';
      document.body.appendChild(frame);
      await loaded;
      const doc = frame.contentDocument;
      const prefix = width + 'px: ';
      assert(doc.documentElement.scrollWidth <= width, prefix + 'no page-level horizontal overflow');
      assert(doc.querySelectorAll('h1').length === 1, prefix + 'one article heading');
      assert(doc.querySelectorAll('h2[id]').length === 10, prefix + 'all ten technical sections present');
      assert([...doc.querySelectorAll('a[href^="#"]')].every(a => doc.getElementById(a.hash.slice(1))), prefix + 'contents and reference anchors resolve');
      assert(new Set([...doc.querySelectorAll('[id]')].map(el => el.id)).size === doc.querySelectorAll('[id]').length, prefix + 'unique IDs');
      assert(doc.querySelector('svg[role="img"] title') && doc.querySelector('svg[role="img"] desc'), prefix + 'diagram has an accessible explanation');
      assert(doc.querySelector('.diagram-scroll').tabIndex === 0 && doc.querySelector('.table-scroll').tabIndex === 0, prefix + 'wide content is keyboard scrollable');
      assert(doc.querySelectorAll('thead th[scope="col"]').length === 3, prefix + 'table headers are associated with columns');
      if (width < 620) {
        for (const selector of ['.diagram-scroll', '.table-scroll']) {
          const region = doc.querySelector(selector);
          assert(region.scrollWidth > region.clientWidth, prefix + selector + ' retains readable content width');
        }
      } else {
        const diagram = doc.querySelector('.diagram-scroll');
        assert(diagram.scrollWidth <= diagram.clientWidth, prefix + 'diagram fits without desktop scrollbar');
      }
      const resistance = 75e-6 / (50 * 25e-6);
      const number = id => Number.parseFloat(doc.getElementById(id).textContent);
      assert(Math.abs(number('solder-resistance') - resistance) < 1e-10, prefix + 'solder resistance matches SI calculation');
      assert(Math.abs(number('solder-rise') - 10 * resistance) < 1e-10, prefix + 'joint temperature rise matches heat flow');
      assert(Math.abs(number('void-resistance') - resistance / 0.8) < 1e-10, prefix + 'area-loss sensitivity matches calculation');
      assert(Math.abs(number('void-rise') - 10 * resistance / 0.8) < 1e-10, prefix + 'area-loss temperature rise matches calculation');
      assert(doc.querySelector('.worked-example').textContent.includes('not a solder-void acceptance rule'), prefix + 'example limitations are explicit');
      assert(doc.querySelector('#ref-ti a').href === 'https://www.ti.com/lit/pdf/spra953', prefix + 'TI source linked');
      assert(doc.querySelector('#ref-nxp a').href === 'https://www.nxp.com/docs/en/application-note/AN1902.pdf', prefix + 'NXP source linked');
      for (const href of ['index.html#cooling-lab', 'tim.html', 'cold-plates.html', 'heat-sinks.html', 'chip.html']) {
        assert(doc.querySelector('a[href="' + href + '"]'), prefix + href + ' linked');
      }
    }
    (async () => {
      try {
        await check(1280);
        await check(390);
        await check(320);
        document.body.dataset.result = 'passed';
        document.getElementById('summary').textContent = 'All ' + messages.length + ' checks passed';
      } catch (error) {
        document.body.dataset.result = 'failed';
        messages.push('FAIL ' + error.message);
        document.getElementById('summary').textContent = error.message;
        document.querySelector('details').open = true;
      }
      document.getElementById('results').textContent = messages.join('\n');
    })();
  </script>
</body>
</html>
