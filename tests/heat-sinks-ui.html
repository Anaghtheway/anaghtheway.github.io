<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heat-sink guide checks</title>
  <style>
    body { background: #08131e; color: #edf3f8; font: 14px monospace; }
    iframe { display: block; border: 0; height: 2200px; margin-top: 20px; }
  </style>
</head>
<body>
  <details><summary id="summary">Running...</summary><pre id="results"></pre></details>
  <script>
    const messages = [];
    function assert(condition, message) {
      if (!condition) throw new Error(message);
      messages.push('PASS ' + message);
    }
    async function check(width) {
      const frame = document.createElement('iframe');
      frame.style.width = width + 'px';
      frame.title = width + 'px heat-sink guide';
      const loaded = new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Article load timed out')), 5000);
        frame.onload = () => { clearTimeout(timeout); resolve(); };
      });
      frame.src = '../heat-sinks.html';
      document.body.appendChild(frame);
      await loaded;
      const doc = frame.contentDocument;
      const prefix = width + 'px: ';
      assert(doc.documentElement.scrollWidth <= width, prefix + 'no page-level horizontal overflow');
      assert(doc.querySelectorAll('h1').length === 1 && doc.querySelector('h1').textContent === 'Heat Sinks: Passive and Fan-Cooled Design', prefix + 'dedicated air-cooling article heading');
      assert(doc.querySelectorAll('h2[id]').length === 8 && doc.querySelectorAll('.hs-contents a').length === 8, prefix + 'eight sections and contents entries');
      assert([...doc.querySelectorAll('a[href^="#"]')].every(a => doc.getElementById(a.hash.slice(1))), prefix + 'all contents and reference anchors resolve');
      assert(new Set([...doc.querySelectorAll('[id]')].map(el => el.id)).size === doc.querySelectorAll('[id]').length, prefix + 'unique IDs');
      assert(frame.contentWindow.getComputedStyle(doc.body).animationName === 'none', prefix + 'static article background');
      assert(frame.contentWindow.getComputedStyle(doc.querySelector('.heat-sink-guide')).boxSizing === 'border-box', prefix + 'article stylesheet loaded');
      const svg = doc.querySelector('svg[role="img"]');
      assert(svg && svg.querySelector('title') && svg.querySelector('desc'), prefix + 'diagram has title and description');
      assert(svg.getAttribute('aria-labelledby').split(' ').every(id => doc.getElementById(id)), prefix + 'diagram name references resolve');
      assert(!new DOMParser().parseFromString(svg.outerHTML, 'image/svg+xml').querySelector('parsererror'), prefix + 'valid SVG XML');
      for (const text of svg.querySelectorAll('text')) {
        const bounds = text.getBBox();
        assert(bounds.x >= 0 && bounds.y >= 0 && bounds.x + bounds.width <= 900 && bounds.y + bounds.height <= 470, prefix + 'diagram label fits: ' + text.textContent);
      }
      for (const region of doc.querySelectorAll('.hs-table-scroll, .hs-diagram-scroll')) {
        assert(region.tabIndex === 0 && region.getAttribute('aria-label'), prefix + 'wide content is named and keyboard focusable');
        if (width < 760) {
          assert(region.scrollWidth > region.clientWidth, prefix + 'wide content retains readable mobile width');
          region.scrollLeft = 100;
          assert(region.scrollLeft > 0, prefix + 'wide region actually scrolls');
          region.scrollLeft = 0;
        } else {
          assert(region.scrollWidth <= region.clientWidth, prefix + 'wide content fits desktop');
        }
      }
      assert(doc.querySelectorAll('thead th[scope="col"]').length === 3 && doc.querySelectorAll('tbody th[scope="row"]').length === 5, prefix + 'construction table has column and row headers');
      const number = id => {
        const value = Number(doc.getElementById('sink-' + id).textContent);
        assert(Number.isFinite(value), prefix + id + ' is numeric');
        return value;
      };
      const close = (id, expected) => assert(Math.abs(number(id) - expected) < 1e-9, prefix + id + ' matches calculated thermal budget');
      const power = number('power');
      const inlet = number('inlet');
      const limit = number('case-limit');
      const interfaceResistance = number('interface-resistance');
      const candidate = number('candidate-resistance');
      close('total-budget', (limit - inlet) / power);
      close('resistance-budget', (limit - inlet) / power - interfaceResistance);
      close('base-temperature', inlet + power * candidate);
      close('case-temperature', inlet + power * (candidate + interfaceResistance));
      close('case-margin', limit - (inlet + power * (candidate + interfaceResistance)));
      close('warm-case', number('warm-inlet') + power * (candidate + interfaceResistance));
      const example = doc.querySelector('.hs-worked-example').textContent;
      assert(example.includes('not measured product data') && example.includes('not a junction-temperature prediction'), prefix + 'worked example assumptions and limitations explicit');
      assert(doc.querySelector('.hs-note a[href="cold-plates.html"]'), prefix + 'liquid-cooling guide clearly separated in introduction');
      for (const href of ['index.html#cooling-lab', 'about.html', 'cold-plates.html', 'fans.html', 'tim.html', 'smt.html']) {
        assert(doc.querySelector('a[href="' + href + '"]'), prefix + href + ' linked');
      }
      const pageUrl = 'https://anaghtheway.github.io/heat-sinks.html';
      assert(doc.querySelector('link[rel="canonical"]').href === pageUrl && doc.querySelector('meta[property="og:url"]').content === pageUrl, prefix + 'heat-sink canonical and social URLs preserved');
      assert(doc.querySelectorAll('li[id^="ref-"] a[href^="https://"]').length === 4, prefix + 'four technical sources');
      frame.remove();
    }
    (async () => {
      try {
        await check(1280);
        await check(390);
        await check(320);
        document.body.dataset.result = 'passed';
        document.getElementById('summary').textContent = 'All ' + messages.length + ' checks passed';
      } catch (error) {
        document.body.dataset.result = 'failed';
        messages.push('FAIL ' + error.message);
        document.getElementById('summary').textContent = error.message;
        document.querySelector('details').open = true;
      }
      document.getElementById('results').textContent = messages.join('\n');
    })();
  </script>
</body>
</html>
